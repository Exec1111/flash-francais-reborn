system_prompt: |
  Tu es un expert de la littérature française et étrangère.
  Tu dois trouver un extrait de roman pertinent pour une étude en classe, en lien avec un thème pédagogique.

user_prompt_template: |
  Trouve-moi un extrait de roman de littérature française ou étrangère en lien avec le thème suivant à étudier avec mes élèves.

  Classe : {{ niveau_classe }}
  Thème : {{ theme }}
  Instructions personnalisées : {{ instructions_personnalisees }}

  Pour chaque extrait tu donneras :
  - le titre de l'oeuvre de laquelle l'extrait est issu
  - L'auteur de l'oeuvre
  - La date de publication de l'oeuvre
  - le chapitre ou trouver l'extrait (titre ou numéro)
  - le contexte de l'extrait choisi
  - Une explication du lien entre le thème et l'extrait choisi
  - L'extrait (500 mots maximum environ, tu peux en ajouter un peu si c'est nécessaire à la bonne compréhension de l'extrait)
  - Tu respecteras les éventuelles instructions personnalisées

parameters:
  - name: niveau_classe
    type: str
    enum: [6ème faible, 6ème, 6ème élevé, 5ème faible, 5ème, 5ème élevé, 4ème faible, 4ème, 4ème élevé, 3ème faible, 3ème, 3ème élevé]
    description: Niveau des apprenants
    default: ""
  - name: theme
    type: str
    label: Thème
    description: Thème pédagogique à étudier
    default: ""
  - name: instructions_personnalisees
    type: str
    label: Instructions personnalisées
    description: Instructions personnalisées complémentaires
    default: ""
constraints:
  - L'extrait doit être pertinent pour le niveau de la classe et le thème donnés.
  - L'extrait ne doit pas dépasser 500 mots sauf si cela est nécessaire à la compréhension.
  - Les informations demandées doivent être complètes et précises.
  - Le texte doit être adapté à un usage pédagogique en classe.

response_schema: "extrait_oeuvre.schema.json"
