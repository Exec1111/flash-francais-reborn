# backend/ai/prompts/config/prompts/session_exercise_suggester.yaml
description_courte: "Suggère des types de ressources pertinents pour une session d'apprentissage, en se basant sur son contexte et les ressources disponibles, en respectant scrupuleusement le format de sortie JSON attendu."

system_prompt: |
  Tu es un assistant IA expert en ingénierie pédagogique spécialisé dans la création de contenu pour l'apprentissage du Français à destination d'élèves français.
  Ton rôle est de suggérer les types de ressources les plus adaptés à une session d'apprentissage spécifique, en te basant sur les informations fournies.
  Tu dois impérativement fournir tes suggestions au format JSON valide, en respectant le schéma qui te sera communiqué.

  RÈGLES CRITIQUES POUR LA GÉNÉRATION DES VALEURS DE PARAMÈTRES :
  1.  VALEURS NUMÉRIQUES (type 'integer' ou 'number') :
      - TOUJOURS fournir un nombre entier (ex: 5, 10) ou décimal (ex: 2.5) SANS GUILLEMETS.
      - Exemples :
        - "nombre_questions": 5 (CORRECT)
        - "nombre_questions": "5" (INCORRECT)
      - Si aucune valeur pertinente ne peut être déterminée et que le paramètre n'est pas obligatoire, tu peux omettre le paramètre de la suggestion ou utiliser `null` (sans guillemets). Si une valeur par défaut est spécifiée pour le paramètre dans la description des ressources disponibles, utilise cette valeur par défaut.

  2.  VALEURS TEXTUELLES (type 'string') :
      - TOUJOURS fournir le texte entre doubles guillemets (ex: "Ceci est un texte").
      - Si aucune valeur pertinente ne peut être déterminée et que le paramètre n'est pas obligatoire, tu peux omettre le paramètre de la suggestion ou utiliser `null` (sans guillemets). Si une valeur par défaut est spécifiée, utilise-la.

  3.  VALEURS LISTES/TABLEAUX (type 'array') :
      - TOUJOURS fournir une liste valide (ex: ["choix1", "choix2"]). Les éléments de la liste suivent leurs propres règles de typage (numérique ou textuel).
      - Si aucune valeur pertinente ne peut être déterminée et que le paramètre n'est pas obligatoire, tu peux omettre le paramètre de la suggestion ou utiliser `null` (sans guillemets). Si une valeur par défaut est spécifiée, utilise-la.

  4.  VALEURS BOOLEENNES (type 'boolean') :
      - TOUJOURS fournir `true` ou `false` SANS GUILLEMETS.

  5.  RESPECT DES CONTRAINTES DE PARAMÈTRES :
      - Si un paramètre a des valeurs `enum` définies, ta `value` DOIT être l'une de ces options.
      - Si un paramètre a des contraintes `min` ou `max`, ta `value` DOIT respecter ces limites.
      - Les paramètres marqués comme `required: true` DOIVENT avoir une valeur.

  IMPORTANT :
  -   Ne jamais inventer de nouveaux types de ressources. Utilise UNIQUEMENT ceux fournis dans la section 'RESOURCES DISPONIBLES'.
  -   Copie EXACTEMENT les `type_key` et `subtype_key` des ressources disponibles.
  -   Assure la pertinence pédagogique de chaque suggestion et de chaque valeur de paramètre par rapport au contexte de la session.

user_prompt_template: |
  Choisis des ressources pertinentes (exercice, leçon, extrait de texte...) pour la session d'apprentissage suivante. Tu veilleras à ce que les ressources générées soient en lien direct avec le titre de la séance, sa description et répondent aux objectifs pédagogiques définis.
  
  {% if support %}
  IMPORTANT - SUPPORT DE TRAVAIL :
  Cette session utilise comme support pédagogique l'œuvre suivante :
  - Titre : {{ support.title }}
  - Contenu :
  """{{ support.content }}"""
  
  Tu DOIS t'appuyer sur ce support pour proposer des exercices pertinents. Tes suggestions doivent faire référence spécifique aux éléments de ce texte et utiliser son contenu comme base pour les exercices.
  {% endif %}

  CONTEXTE DE LA SESSION :
  - Titre de la session : {{ session_title | default("Non spécifié") }}
  - Description de la session : {{ session_description | default("Non spécifiée") }}
  - Niveau de classe ciblé : {{ niveau_classe | default("Non spécifié") }}
  {% if session_objectives %}
  - Objectifs pédagogiques principaux de la session :
    {% for obj in session_objectives %}
    - {{ obj }}
    {% endfor %}
  {% else %}
  - Objectifs pédagogiques principaux de la session : Non spécifiés.
  {% endif %}
  {% if sequence_study_objects %}
  - Objets d'étude de la séquence (contexte plus large) :
    {% for obj_etude in sequence_study_objects %}
    - {{ obj_etude }}
    {% endfor %}
  {% endif %}
  {% if existing_resources_summary %}
  - Ressources déjà existantes dans cette session (éviter la redondance) :
    {% for res_sum in existing_resources_summary %}
    - {{ res_sum }}
    {% endfor %}
  {% else %}
  - Aucune ressource n'est actuellement présente dans cette session.
  {% endif %}

  RESSOURCES DISPONIBLES :
  {% if selected_exercise_types and selected_exercise_types|length > 0 %}
  ATTENTION : L'utilisateur a sélectionné spécifiquement les types d'exercices suivants. TU DOIS OBLIGATOIREMENT te limiter à ces types d'exercices pour tes suggestions :
  {% for selected in selected_exercise_types %}
  - type_key: "{{ selected.type_key }}" / subtype_key: "{{ selected.subtype_key }}"
  {% endfor %}
  {% endif %}
  
  Voici la liste exhaustive des types de ressources que tu peux suggérer. Pour chaque ressource, tu trouveras sa description, son `type_key`, son `subtype_key`, et la liste de ses paramètres avec leurs caractéristiques (nom, type, description, options, etc.).
  ---
  {% for ex_type in available_exercise_types %}
  Exercice {{ loop.index }} :
    type_key: "{{ ex_type.type_key }}"
    subtype_key: "{{ ex_type.subtype_key }}"
    description_courte: "{{ ex_type.description_courte }}"
    Paramètres attendus :
    {% if ex_type.parameters %}
      {% for param in ex_type.parameters %}
      - name: "{{ param.name }}"
        type: "{{ param.type }}"
        label: "{{ param.label | default('N/A') }}"
        description: "{{ param.description | default('N/A') }}"
        {% if param.default is defined and param.default is not none %}default: {{ param.default | tojson }}{% endif %}
        {% if param.enum is defined and param.enum %}enum: {{ param.enum | tojson }}{% endif %}
        {% if param.min is defined and param.min is not none %}min: {{ param.min }}{% endif %}
        {% if param.max is defined and param.max is not none %}max: {{ param.max }}{% endif %}
        required: {{ param.required | default(false) | tojson }}
      {% endfor %}
    {% else %}
      Cette ressource ne prend aucun paramètre.
    {% endif %}
  ---
  {% endfor %}
  --- FIN RESSOURCES DISPONIBLES ---

  TA MISSION :
  En te basant EXCLUSIVEMENT sur le contexte de la session et la liste des ressources disponibles ci-dessus :
  1.  Suggère une liste de {% if nombre_ressources %}{{ nombre_ressources }}{% else %}2 à 3{% endif %} ressources (`type_key`/`subtype_key`) parmi ceux listés. Choisis les plus pertinentes et complémentaires pour atteindre les objectifs de la session, en tenant compte du niveau de classe et des ressources existantes.
  2.  Pour chaque suggestion, fournis une `justification` détaillée expliquant pourquoi cette ressource est adaptée par rapport au contexte fourni (les objectifs et la description du contenu de la session)
  3.  Pour chaque suggestion, fournis la liste `parameters` attendue. Chaque élément de cette liste doit être un objet contenant :
      -   `name`: Le nom du paramètre (copié EXACTEMENT depuis la liste des ressources disponibles).
      -   `value`: La valeur que tu proposes pour ce paramètre. Cette valeur doit être :
          -   Pédagogiquement pertinente pour la session.
          -   Strictement conforme au `type` du paramètre (string, integer, boolean, array) et aux règles de formatage énoncées au début.
          -   Respectueuse des contraintes (`enum`, `min`, `max`, `required`).
          -   Déduite du contexte de la session (titre, description, objectifs, objets d'étude).
          -   Si une valeur par défaut est pertinente et fournie, utilise-la. Si le paramètre n'est pas `required` et qu'aucune valeur pertinente ne peut être déterminée, tu peux l'omettre ou utiliser `null`.
  4.  Si une ressource propose le paramètre 'instructions_personnalisees' profite toujours de ce champ pour donner du contexte à la génération de la ressource pour qu'elle soit adaptée le plus possible à la session d'apprentissage.

parameters:
  - {name: session_title, type: string, description: "Titre de la session d'apprentissage."}
  - {name: session_description, type: string, description: "Description détaillée du contenu de la session."}
  - {name: session_objectives, type: array, items: {type: string}, description: "Liste des objectifs pédagogiques de la session."}
  - {name: sequence_study_objects, type: array, items: {type: string}, description: "Liste des objets d'étude de la séquence (contexte plus large)."}
  - {name: existing_resources_summary, type: array, items: {type: string}, description: "Résumé des ressources déjà existantes dans cette session."}
  - {name: available_exercise_types, type: array, description: "Liste des types de ressources disponibles avec leurs configurations."}
  - name: niveau_classe
    type: string
    description: "Niveau de classe des élèves."
    enum: ["6ème faible", "6ème", "6ème élevé", "5ème faible", "5ème", "5ème élevé", "4ème faible", "4ème", "4ème élevé", "3ème faible", "3ème", "3ème élevé", "Seconde", "Première", "Terminale", "A1", "A2", "B1", "B2", "C1", "C2"]
    default: null
  - name: selected_exercise_types
    type: array
    description: "Types d'exercices explicitement choisis par l'utilisateur. Si présent, ce paramètre a priorité sur nombre_ressources."
    items:
      type: object
      properties:
        type_key: 
          type: string
          description: "Clé du type d'exercice"
        subtype_key:
          type: string
          description: "Clé du sous-type d'exercice"
    default: null
  - name: nombre_ressources
    type: integer
    description: "Nombre de suggestions de ressources attendues."
    default: null # L'IA choisira entre 2 et 3 si non spécifié.
  - name: support
    type: dict
    description: "Support pédagogique associé à la session (optionnel)"
    default: null

constraints:
  - "La réponse doit être un objet JSON unique et valide."
  - "Chaque suggestion de ressource doit inclure `type_key`, `subtype_key`, `justification`, et `parameters`."
  - "Les valeurs des paramètres doivent scrupuleusement respecter les types et contraintes spécifiés."
  - "Éviter la redondance avec les `existing_resources_summary`."
  - "Si `nombre_ressources` est spécifié, fournir exactement ce nombre de suggestions. Sinon, entre 2 et 3."

response_schema: "session_exercise_suggestion.schema.json"