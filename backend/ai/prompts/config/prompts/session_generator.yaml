system_prompt: |
  Tu es un expert en pédagogie du français.
  Ta tâche est de planifier des séances d'apprentissage (sessions) pour une séquence pédagogique.
  Chaque séance doit avoir un objectif clair, une durée appropriée, et éventuellement des ressources associées.
  Les séances doivent suivre une progression logique et être adaptées au niveau des apprenants.

user_prompt_template: |
  Je souhaite créer {{ nombre_seances }} séance(s) pour une séquence pédagogique en français avec les caractéristiques suivantes :
  
  Niveau des apprenants : {{ niveau }}
  {% if description_sequence %}
  Description de la séquence : {{ description_sequence }}
  {% endif %}
  {% if study_objects %}
  Objets d'étude de la séquence :
  {% for study_object in study_objects %}
  - {{ study_object.title }} (ID: {{ study_object.id }}){% if study_object.description %}, Description: {{ study_object.description }}{% endif %}
    {% if study_object.oeuvres and study_object.oeuvres|length > 0 %}
    Œuvres associées :
    {% for oeuvre in study_object.oeuvres %}
    - {{ oeuvre.titre }} par {{ oeuvre.auteur_complet }} (ID: {{ oeuvre.id }})
      {% if oeuvre.auteur and oeuvre.auteur.nationalite %} ({{ oeuvre.auteur.nationalite }}){% endif %}
      {% if oeuvre.type %}(Type: {{ oeuvre.type }}){% endif %}
      {% if oeuvre.genre %}, Genre: {{ oeuvre.genre }}{% endif %}
      {% if oeuvre.date_publication %}, Année: {{ oeuvre.date_publication }}{% endif %}
      {% if oeuvre.extrait %} (Extrait){% else %} (Œuvre complète){% endif %}
      {% if oeuvre.mouvement_litteraire %}, Mouvement: {{ oeuvre.mouvement_litteraire }}{% endif %}
      {% if oeuvre.langue_originale %}, Langue: {{ oeuvre.langue_originale }}{% endif %}
      {% if oeuvre.contenu and oeuvre.contenu.resume %}, Résumé: {{ oeuvre.contenu.resume }}{% endif %}
      {% if oeuvre.contenu and oeuvre.contenu.themes %}, Thèmes: {{ oeuvre.contenu.themes|join(', ') }}{% endif %}
      {% if oeuvre.pedagogie and oeuvre.pedagogie.niveau_mini_recommande %}, Niveau recommandé: {{ oeuvre.pedagogie.niveau_mini_recommande }}{% endif %}
      {% if oeuvre.pedagogie and oeuvre.pedagogie.domaines_programme %}, Domaines: {{ oeuvre.pedagogie.domaines_programme|join(', ') }}{% endif %}
      {% if oeuvre.tags %}, Tags: {{ oeuvre.tags|join(', ') }}{% endif %}
    {% endfor %}
    {% endif %}
  {% endfor %}
  {% endif %}
  {% if objectifs %}
  Objectifs pédagogiques de la séquence :
  {% for objectif in objectifs %}
  - {{ objectif.title }} (ID: {{ objectif.id }}{% if objectif.description %}, Description: {{ objectif.description }}{% endif %})
  {% endfor %}
  {% endif %}
  
  
  {% if instructions_personnalisees %}
  ## Instructions personnalisées :
  {{ instructions_personnalisees }}
  {% endif %}
  
  Génère {{ nombre_seances }} séance(s) avec les informations essentielles suivantes pour chaque séance :

  1. **Titre** : Un titre descriptif et précis pour la séance
  2. **Notes** : Description détaillée du contenu et de l'organisation de la séance. Détaille bien ces otes qui permettront par la suite de proposer des leçon et des exercices adaptées.
  3. **Date** : Date de la séance (au format ISO 8601)
  4. **Durée** : Durée estimée en minutes (optionnel)
  5. **Objectifs** : Liste des IDs des objectifs pédagogiques associés à cette séance
  6. **Œuvres** : Liste des IDs des œuvres qui seront exploitées dans cette séance

  Retourne la réponse au format JSON structuré.

  {% if nombre_seances == "auto" %}
  Tu es libre de déterminer le nombre optimal de séances nécessaires pour couvrir les objectifs pédagogiques.
  {% endif %}

  IMPORTANT : Utilise les informations détaillées des œuvres pour adapter les séances :
  - Adapte le contenu selon le niveau recommandé de chaque œuvre
  - Intègre les thèmes et motifs littéraires dans la description de la séance
  - Considère le mouvement littéraire pour contextualiser historiquement l'œuvre
  - Adapte la séance selon que l'œuvre est complète ou un extrait
  - Utilise les domaines du programme pour lier aux objectifs officiels
  - Intègre le contexte biographique et culturel de l'auteur dans les notes
  - Associe chaque séance aux œuvres appropriées en utilisant leurs IDs dans oeuvre_ids

  Pour chaque séance, fournis :
  - Un titre précis et descriptif
  - Des notes détaillées décrivant le contenu et l'organisation
  - Les œuvres les plus pertinentes pour les objectifs de la séance

parameters:
  - name: nombre_seances
    type: str
    description: Nombre de séances à générer ou "auto" pour laisser l'IA décider
  - name: titre_sequence
    type: str
    description: Titre de la séquence pédagogique pour laquelle générer des séances
  - name: description_sequence
    type: str
    description: Description courte de la séquence pédagogique
  - name: niveau
    type: str
    enum: [6ème faible, 6ème, 6ème élevé, 5ème faible, 5ème, 5ème élevé, 4ème faible, 4ème, 4ème élevé, 3ème faible, 3ème, 3ème élevé]
    description: Niveau des apprenants
  - name: objectifs
    type: list
    description: Liste des objectifs pédagogiques de la séquence
    schema:
      type: object
      properties:
        id: 
          type: integer
        title: 
          type: string
        description:
          type: string
  - name: study_objects
    type: list
    description: Liste des objets d'étude de la séquence
    schema:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        oeuvres:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID unique de l'œuvre pour référence dans oeuvre_ids
              titre:
                type: string
              auteur_complet:
                type: string
              auteur:
                type: object
                properties:
                  nom:
                    type: string
                  prenom:
                    type: string
                  nationalite:
                    type: string
              type:
                type: string
              genre:
                type: string
              date_publication:
                type: integer
              extrait:
                type: boolean
              mouvement_litteraire:
                type: string
              langue_originale:
                type: string
              contenu:
                type: object
              pedagogie:
                type: object
              tags:
                type: array
                items:
                  type: string
  - name: instructions_personnalisees
    type: str
    description: Instructions personnalisées pour la génération des séances
    default: ""

constraints:
   - Les séances doivent être cohérentes avec le niveau {{ niveau }} des apprenants et la description fournie.
   - L'ensemble des séances doit couvrir tous les objectifs pédagogiques.
   - Les dates des séances doivent être réalistes et progressives.
   - Adapte le contenu selon les caractéristiques spécifiques de chaque œuvre (genre, époque, difficulté).
   - Pour les extraits : concentre-toi sur l'analyse ciblée et la compréhension contextuelle.
   - Pour les œuvres complètes : propose une progression dans l'étude de l'œuvre sur plusieurs séances.
   - Respecte les niveaux recommandés des œuvres et les domaines du programme associés.
   - Intègre les thèmes et mouvements littéraires dans la description des séances.
   - Utilise les informations biographiques des auteurs pour contextualiser les œuvres.
   - Adapte le contenu selon la nationalité et l'époque des auteurs.

response_schema: "session_generator.schema.json"
