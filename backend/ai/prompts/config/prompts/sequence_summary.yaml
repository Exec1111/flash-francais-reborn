title: Génération d'une fiche de questions de révision
description: Génère une fiche de questions de révision pour une séquence pédagogique avec des questions ciblées sur chaque ressource

system_prompt: |
  Tu es un assistant pédagogique expert en didactique du français.
  Ta tâche est de générer une fiche de questions de révision (entre 10 et 20 questions) basée sur le contenu d'une séquence pédagogique.
  Pour chaque question, tu dois préciser la ressource spécifique dans laquelle l'élève peut trouver la réponse.
  Les questions doivent être variées en termes de difficulté et couvrir les points essentiels de la séquence.
  Fournis également les réponses attendues pour chaque question.

user_prompt_template: |
  # Instructions pour la génération d'une fiche de questions de révision
  
  ## Données de la séquence
  Titre: {{ titre_sequence }}
  Description: {{ description | default('Pas de description fournie') }}
  
  ## Objectifs d'apprentissage
  {% for objectif in objectifs %}
  - {{ objectif.description }}
  {% endfor %}
  
  {% if study_objects is defined and study_objects|length > 0 %}
  ## Objets d'étude associés
  {% for objet in study_objects %}
  - {{ objet.title }}: {{ objet.description }}
  {% endfor %}
  {% endif %}
  
  {% if sessions is defined and sessions|length > 0 %}
  ## Séances de la séquence
  {% for seance in sessions %}
  ### Séance {{ loop.index }}: {{ seance.title }}
  - Description: {{ seance.description | default('Pas de description') }}
  - Notes: {{ seance.notes | default('Pas de notes') }}
  {% if seance.resources is defined and seance.resources|length > 0 %}
  - Ressources associées:
    {% for ressource in seance.resources %}
    - Type: {{ ressource.type_name | default('Non spécifié') }} / {{ ressource.sub_type_name | default('Non spécifié') }}
    - Titre: {{ ressource.title | default('Pas de titre') }}
    - Description: {{ ressource.description | default('Pas de description') }}
    - Contenu: {{ ressource.content | default('Pas de contenu') }}
    {% endfor %}
  {% endif %}
  {% endfor %}
  {% endif %}
  
  ## Ressources globales de la séquence
  {% for ressource in ressources %}
  ### Ressource: {{ ressource.title }}
    - Type: {{ ressource.type_name | default('Non spécifié') }} / {{ ressource.sub_type_name | default('Non spécifié') }}
    - Titre: {{ ressource.title | default('Pas de titre') }}
    - Description: {{ ressource.description | default('Pas de description') }}
    - Contenu: {{ ressource.content | default('Pas de contenu') }}
  {% endfor %}
  
  ## Tâche
  À partir de toutes ces informations, crée une fiche de questions de révision qui respecte les contraintes suivantes:
  
  1. Génère entre 10 et 20 questions qui couvrent les points essentiels de la séquence
  
  2. Pour chaque question:
     - Indique clairement la ressource spécifique où l'élève peut trouver la réponse
     - Précise la séance associée si possible
     - Propose une réponse attendue complète et précise
     - Attribue un niveau de difficulté (facile, moyen, difficile)
  
  3. Assure-toi que les questions:
     - Sont variées en format (ouvertes, à choix multiples, vrai/faux, complétion, etc.)
     - Couvrent différents niveaux de la taxonomie de Bloom (connaissance, compréhension, application, analyse)
     - Sont réparties de manière équilibrée entre les différentes séances et ressources
     - Sont formulées clairement et sans ambiguïté
  
  4. Donne un titre pertinent à cette fiche de révision qui reflète le contenu de la séquence
  
  5. Ajoute une brève description du contenu de la fiche de révision
  
  {% if elements_specifiques %}
  ## Instructions personnalisées :
  {{ elements_specifiques }}
  {% endif %}
  
variables:
  - name: titre_sequence
    type: string
    description: Titre de la séquence pédagogique
    required: true
  
  - name: description
    type: string
    description: Description de la séquence pédagogique
    required: false
    
  - name: objectifs
    type: array
    description: Liste des objectifs pédagogiques de la séquence
    required: true
    
  - name: study_objects
    type: array
    description: Liste des objets d'étude associés à la séquence
    required: false
  
  - name: sessions
    type: array
    description: Liste des séances associées à la séquence
    required: false
    
  - name: ressources
    type: array
    description: Liste détaillée des ressources associées à la séquence avec leur contenu
    required: true

parameters:
  - name: elements_specifiques
    type: string
    description: "Eléments spécifiques à mettre en valeur dans le résumé (optionnel)"
    default: ""
    
  - name: style_pedagogique
    type: string
    enum: ["Synthétique", "Détaillé", "Visuel"]
    description: "Style pédagogique du résumé"
    default: "Synthétique"

response_schema: "sequence_summary.schema.json"
