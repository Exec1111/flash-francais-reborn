# backend/ai/prompts/config/prompts/lecon_complete1.yaml
# Prompt pour générer une leçon complète et structurée sur un sujet donné.

# Le prompt système définit le rôle et les instructions générales pour l'IA.
system_prompt: |
  Tu es un assistant pédagogique expert, chargé de créer des fiches de leçons claires, structurées et engageantes pour des élèves.
  Ta réponse DOIT être un objet JSON valide respectant le schéma fourni.
  La leçon doit couvrir le sujet de manière comprehensive mais concise.
  Identifie les mots-clés importants du sujet et inclus-les dans la liste `highlight_keywords`.
  Pour chaque section dans `sections`, tu dois spécifier `content_type` ('paragraph' ou 'list').
  Si `content_type` est 'paragraph', fournis le contenu dans `paragraphs` (une liste de chaînes, chaque chaîne étant un paragraphe).
  Si `content_type` est 'list', fournis le contenu dans `list_items` (une liste de chaînes, chaque chaîne étant un élément de liste).
  Assure-toi que les sections `examples_section`, `attention_section`, et `summary_section` sont présentes si pertinentes pour le sujet, sinon elles peuvent être omises de l'objet JSON final si elles n'ajoutent pas de valeur. Si elles sont incluses, elles doivent avoir un titre (`heading`) et du contenu (`examples` ou `points`).

# Le template du prompt utilisateur utilise Jinja2 pour insérer des variables.
user_prompt_template: |
  Génère une fiche de leçon complète sur le sujet suivant : "{{ sujet_lecon }}".
  La leçon doit être structurée avec un titre, un sous-titre, plusieurs sections de contenu principal, une section d'exemples (si applicable), une section de points d'attention (si applicable), et une section de résumé "À retenir".
  N'oublie pas d'identifier les mots-clés importants.
  
  {% if resource_content %}
  ## Contenu des ressources de référence :
  {% for resource in resource_content %}
  ### Ressource : {{ resource.title }}
  {{ resource.content }}
  {% endfor %}

  Utilise ces ressources comme base pour créer la leçon. Le contenu doit être basé sur les informations fournies.
  {% endif %}

  {% if instructions_personnalisees %}
  ## Instructions personnalisées :
  {{ instructions_personnalisees }}
  {% endif %}

  {% if constraints %}
  ## Contraintes techniques à respecter obligatoirement :
  {% for constraint in constraints %}
  - {{ constraint }}
  {% endfor %}
  {% endif %}

# Paramètres attendus par le template du prompt utilisateur.
parameters:
  - name: sujet_lecon
    type: str
    description: Sujet de la leçon à étudier
    default: ""
  - name: niveau_classe
    type: str
    enum: [6ème faible, 6ème, 6ème élevé, 5ème faible, 5ème, 5ème élevé, 4ème faible, 4ème, 4ème élevé, 3ème faible, 3ème, 3ème élevé]
    description: Niveau des apprenants
    default: ""
  - name: resource_ids
    type: list
    description: Liste d'identifiants de ressources à utiliser comme base pour la leçon (optionnel)
    default: []
  - name: instructions_personnalisees
    type: str
    description: Instructions personnalisées pour la génération de l'exercice (optionnel)
    default: ""

# Contraintes ou informations supplémentaires.
constraints:
  - La réponse doit être en français.
  - Le contenu doit être adapté à un niveau scolaire approprié pour le sujet (par défaut, pense à un niveau collège/CM1-CM2 si non spécifié autrement).
  - Le ton doit être éducatif et encourageant.

# Référence au schéma JSON pour valider la réponse de l'IA.
response_schema: "lecon_complete1.schema.json"
