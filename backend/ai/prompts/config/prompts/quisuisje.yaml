system_prompt: |
  Ta tâche est de proposer un petit jeu éducatif en fournissant des indices pour deviner un concept, un lieu, un personnage ou un mot de vocabulaire

description_courte: "Génère un jeu éducatif permettant de découvrir un concept, un lieu, un personnage ou un mot de vocabulaire en s'amusant"

user_prompt_template: |
  Je souhaite créer un jeu éducatif pour des apprenants de niveau {{ niveau }}.
   Nombre d'indice à fournir par mots : {{ nb_indice }}
  {% if liste_mots %}
  Voici la liste des mots à utiliser :
  {% for mot in liste_mots %}
  - {{ mot }}
  {% endfor %}
  {% elif theme %}
  Le thème des mots, personnages ou concept est : {{ theme }}
  {% endif %}
  {% if resource_content %}
  ## Contenu des ressources de référence :
  {% for resource in resource_content %}
  ### Ressource : {{ resource.title }}
  {{ resource.content }}
  {% endfor %}

  Utilise ces ressources comme base pour créer les mots et indices du jeu. Les mots doivent être extraits ou inspirés du contenu fourni.
  {% endif %}

  {% if instructions_personnalisees %}
  ## Instructions personnalisées :
  {{ instructions_personnalisees }}
  {% endif %}

  {% if constraints %}
  ## Contraintes techniques à respecter obligatoirement :
  {% for constraint in constraints %}
  - {{ constraint }}
  {% endfor %}
  {% endif %}

  Pour chaque mot, fournit autant d'indice que demandé. Les indices doivent permettre de deviner le mot, le personnage ou le concept.

parameters:
  - name: theme
    type: str
    description: Thème à partir duquel générer les mots de vocabulaire (optionnel)
    default: ""
  - name: niveau
    type: str
    enum: [6ème faible, 6ème, 6ème élevé, 5ème faible, 5ème, 5ème élevé, 4ème faible, 4ème, 4ème élevé, 3ème faible, 3ème, 3ème élevé]
    description: Niveau des apprenants  
  - name: liste_mots
    type: list
    description: Liste de mots à utiliser pour l'exercice (optionnel, prioritaire si fourni)
    default: []
  - name: nb_indice
    type: int
    description: Nombre d'indices à fournir pour chaque mot
    default: 5
  - name: resource_ids
    type: list
    description: Liste d'identifiants de ressources à utiliser comme base pour le jeu Qui suis-je (optionnel)
    default: []
  - name: instructions_personnalisees
    type: str
    description: Instructions personnalisées pour la génération de l'exercice (optionnel)
    default: ""

constraints:
  - Si une liste de mots est fournie, elle seule doit être utilisée.
  - Respecte le nombre d'indices demandés
  - Sinon, les mots doivent être générés à partir du thème proposé et adaptés au niveau {{ niveau }}.
  - Les indices doivent être courts, clairs et adaptés au niveau des apprenants.
  - Respecter les éventuelles instructions personnalisées fournies.
  - La liste sera composée de 5 a 10 mots.

response_schema: "quisuisje.schema.json"
