description_courte: "Évalue la compréhension ou les connaissances sur un thème donné avec des questions à choix multiples."

system_prompt: |
  Tu es un expert en pédagogie du français dans un collège français.
  Ta tâche est de créer un exercice de type QCM (Questionnaire à Choix Multiples).
  L'exercice doit être adapté au niveau de l'apprenant et porter sur le thème spécifié.
  Pour chaque question, tu dois indiquer quelle option est la réponse correcte et fournir une brève explication.

user_prompt_template: |
  Crée un QCM en français sur le thème : {{ theme }}.
  Niveau de l'apprenant : {{ niveau }}.
  Nombre de questions : {{ nombre_questions }}.
  Nombre d'options par question : {{ nb_options }}.

  {% if resource_content %}
  ## Contenu des ressources de référence :
  {% for resource in resource_content %}
  ### Ressource : {{ resource.title }}
  {{ resource.content }}
  {% endfor %}

  Utilise ces ressources comme base pour créer le QCM. Les questions doivent être basées sur le contenu fourni.
  {% endif %}

  {% if instructions_personnalisees %}
  ## Instructions personnalisées :
  {{ instructions_personnalisees }}
  {% endif %}

  Contraintes :
  {% for c in constraints %}
  - {{ c }}
  {% endfor %}

parameters:
  - name: theme
    type: str
    description: Thème sur lequel le QCM doit être créé
  - name: niveau
    type: str
    enum: [6ème faible, 6ème, 6ème élevé, 5ème faible, 5ème, 5ème élevé, 4ème faible, 4ème, 4ème élevé, 3ème faible, 3ème, 3ème élevé]
    description: Niveau des apprenants
  - name: nombre_questions
    type: int
    description: nombre de questions au total
    default: 5
  - name: nb_options
    type: int
    default: 4
    description: Nombre de choix par question
  - name: resource_ids
    type: list
    description: Liste d'identifiants de ressources à utiliser comme base pour le QCM (optionnel)
    default: []
  - name: instructions_personnalisees
    type: str
    description: Instructions personnalisées pour la génération de l'exercice (optionnel)
    default: ""

constraints:
  - Les questions doivent être claires et adaptées au niveau {{ niveau }}.
  - Chaque question doit avoir exactement {{ nb_options }} options.
  - Une seule option doit être correcte, indiquée par le champ "reponse_correcte" qui contient l'ID de l'option correcte.
  - Chaque question doit contenir une explication concise de la réponse correcte.
  - Les distracteurs doivent être plausibles mais clairement incorrects.
  - Les questions doivent couvrir différents aspects du thème.
  - Respecter les éventuelles instructions personnalisées fournies.

response_schema: "qcm.schema.json"
