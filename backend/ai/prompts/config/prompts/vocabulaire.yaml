system_prompt: |
  Tu es un expert en pédagogie du français.
  Ta tâche est de générer un exercice de vocabulaire adapté au niveau des apprenants.
  Pour chaque mot, fournis une définition simple, claire et adaptée au niveau indiqué.
  Si une liste de mots est fournie, utilise-la exclusivement. Sinon, génère une liste pertinente à partir du thème proposé. Si une ressource ezst proposée, les mots et les exemples doivent impérativement être dans la ressource.

description_courte: "Génère des exercices pour identifier et utiliser du vocabulaire spécifique à un thème."

user_prompt_template: |
   Je souhaite créer un exercice de vocabulaire pour des apprenants de niveau {{ niveau }}.
   {% if liste_mots %}
   Voici la liste des mots à utiliser :
   {% for mot in liste_mots %}
   - {{ mot }}
   {% endfor %}
   {% elif theme %}
   Le thème du vocabulaire est : {{ theme }}
   {% endif %}

   {% if resource_content %}
   ## Contenu des ressources de référence :
   {% for resource in resource_content %}
   ### Ressource : {{ resource.title }}
   {{ resource.content }}
   {% endfor %}

   Utilise ces ressources comme base pour extraire ou adapter le vocabulaire. Les mots doivent être basés sur le contenu fourni.
   {% endif %}

   {% if instructions_personnalisees %}
   ## Instructions personnalisées :
   {{ instructions_personnalisees }}
   {% endif %}

   {% if constraints %}
   ## Contraintes techniques à respecter obligatoirement :
   {% for constraint in constraints %}
   - {{ constraint }}
   {% endfor %}
   {% endif %}

   Pour chaque mot, fournis une définition courte et adaptée au niveau des apprenants, ainsi qu'un exemple d'utilisation du mot dans une phrase. La sortie doit être une liste d'objets avec les champs "word", "definition" et "exemple".

parameters:
   - name: theme
     type: str
     label: Thème
     description: Thème à partir duquel générer les mots de vocabulaire (optionnel)
     default: ""
   - name: niveau
     type: str
     label: Niveau
     enum: [6ème faible, 6ème, 6ème élevé, 5ème faible, 5ème, 5ème élevé, 4ème faible, 4ème, 4ème élevé, 3ème faible, 3ème, 3ème élevé]
     description: Niveau des apprenants
   - name: liste_mots
     type: list
     label: Liste de mots
     description: Liste de mots à utiliser pour l'exercice (optionnel, prioritaire si fourni)
     default: []
   - name: resource_ids
     type: list
     label: Ressources de référence
     description: Liste d'identifiants de ressources à utiliser comme base pour l'exercice de vocabulaire (optionnel)
     default: []
   - name: instructions_personnalisees
     type: str
     label: Instructions personnalisées
     description: Instructions personnalisées pour la génération de l'exercice (optionnel)
     default: ""

constraints:
  - Si une liste de mots est fournie, elle seule doit être utilisée.
  - Si des ressources sont fournies, les mots choisis doivent être contenus dans cette ressource et les exemples doivent être la restitution exacte du passage de texte contenant ce mot
  - Sinon, les mots doivent être générés à partir du thème proposé et adaptés au niveau {{ niveau }}.
  - Les définitions doivent être courtes, claires et adaptées au niveau des apprenants.
  - Les exemples doivent être des phrases complètes et naturelles utilisant le mot de manière appropriée.
  - Respecter les éventuelles instructions personnalisées fournies.
  - La liste sera composée de 5 a 10 mots.
  - IMPORTANT - Les définitions seront mélangées aléatoirement dans l'interface pour éviter que l'ordre des mots et des définitions soit identique (ce qui rendrait l'exercice trivial).

response_schema: "vocabulaire.schema.json"
