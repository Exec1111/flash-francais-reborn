description_courte: "Génère une dictée adaptée au niveau des apprenants avec des explications grammaticales"

system_prompt: |
  Tu es un professeur de français expert dans la création de dictées adaptées pour des apprenants de différents niveaux.
  Ta mission est de créer une dictée pertinente qui répond aux critères spécifiés.
  La dictée doit être adaptée au niveau des apprenants et traiter du thème demandé.
  Chaque dictée doit être accompagnée d'explications sur les points grammaticaux et orthographiques importants.

user_prompt_template: |
   Je souhaite créer une dictée pour des apprenants de niveau {{ niveau }}.
   {% if theme %}
   Le thème de la dictée doit être : {{ theme }}
   {% endif %}
   {% if longueur %}
   La longueur approximative souhaitée est de {{ longueur }} mots.
   {% endif %}
   {% if mots_cles %}
   Les mots suivants doivent apparaître dans la dictée : {{ mots_cles }}
   {% endif %}
   {% if temps_verbaux %}
   Les temps de conjugaison à travailler sont : {{ temps_verbaux }}
   {% endif %}
   {% if notions_grammaire %}
   Les notions de grammaire à inclure sont : {{ notions_grammaire }}
   {% endif %}

   {% if resource_content %}
   ## Contenu des ressources de référence :
   {% for resource in resource_content %}
   ### Ressource : {{ resource.title }}
   {{ resource.content }}
   {% endfor %}

   Utilise ces ressources comme base pour créer la dictée. Les mots et structures doivent être basés sur le contenu fourni.
   {% endif %}

   {% if instructions_personnalisees %}
   ## Instructions personnalisées :
   {{ instructions_personnalisees }}
   {% endif %}

   Contraintes :
   {% for c in constraints %}
   - {{ c }}
   {% endfor %}

parameters:
   - name: theme
     type: str
     label: Thème
     description: Thème de la dictée (optionnel)
     default: ""
   - name: niveau
     type: str
     label: Niveau
     enum: [6ème faible, 6ème, 6ème élevé, 5ème faible, 5ème, 5ème élevé, 4ème faible, 4ème, 4ème élevé, 3ème faible, 3ème, 3ème élevé]
     description: Niveau des apprenants
   - name: longueur
     type: str
     label: Longueur
     description: Longueur approximative de la dictée en nombre de mots (optionnel)
     default: "100-150"
   - name: mots_cles
     type: str
     label: Mots clés
     description: Liste de mots complets qui doivent apparaître dans la dictée (exemple "talent, réputation, blancheur")
     default: ""
   - name: temps_verbaux
     type: str
     label: Temps verbaux
     description: Temps verbaux complets à travailler dans la dictée (exemple "présent de l'indicatif, passé composé")
     default: ""
   - name: notions_grammaire
     type: str
     label: Notions de grammaire
     description: Notions de grammaire complètes à inclure dans la dictée (exemple "accord sujet-verbe, complément du nom")
     default: ""
   - name: resource_ids
     type: list
     label: Ressources de référence
     description: Liste d'identifiants de ressources à utiliser comme base pour la dictée (optionnel)
     default: []
   - name: instructions_personnalisees
     type: str
     label: Instructions personnalisées
     description: Instructions personnalisées pour la génération de la dictée (optionnel)
     default: ""

constraints:
  - "La dictée doit être adaptée au niveau des apprenants."
  - "Tous les mots clés fournis doivent apparaître dans la dictée."
  - "Si des temps verbaux sont spécifiés, la dictée doit inclure plusieurs exemples de ces temps."
  - "Si des notions de grammaire sont spécifiées, elles doivent être présentes dans la dictée."
  - "Une explication des points grammaticaux et orthographiques importants doit être fournie séparément."
  - "Les explications doivent être claires et pédagogiques, adaptées au niveau des apprenants."

response_schema: "dictee.schema.json"
