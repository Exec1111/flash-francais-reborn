<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Vocabulaire - Classe de Français</title>
    <style>
        /* --- Styles CSS pour l'aspect du jeu --- */
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        h1 {
            color: #0056b3;
            text-align: center;
        }

         /* Styles pour le choix du mode */
        .mode-selection {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
            border: 1px solid #ced4da;
             max-width: 600px; /* Limite la largeur de la zone de sélection */
             margin-left: auto; /* Centre la zone de sélection */
             margin-right: auto;
        }

        .mode-selection h2 {
            margin-top: 0;
            color: #333;
        }

        .mode-selection label {
            margin: 0 15px;
            font-size: 1.1em;
            cursor: pointer;
        }

         .mode-selection button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.1em;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .mode-selection button:hover:not(:disabled) {
            background-color: #0056b3;
        }

         .mode-selection button:disabled {
             background-color: #cccccc;
             cursor: not-allowed;
         }


        /* Conteneurs du jeu pour chaque mode */
        .game-container {
            display: none; /* Caché par défaut */
             /* flexbox gère l'alignement des listes À L'INTÉRIEUR */
             flex-direction: row; /* Par défaut, les listes s'alignent horizontalement */
            justify-content: center;
            gap: 40px; /* Espace entre les colonnes */
            flex-wrap: wrap; /* Permet de passer à la ligne sur petits écrans */
            width: 100%; /* S'assure que le conteneur prend toute la largeur disponible */
            box-sizing: border-box; /* Inclut padding et border dans la largeur */
        }

        /* Style pour le paragraphe d'instructions SPÉCIFIQUE au mode */
        .game-container .instructions {
             width: 100%; /* L'instruction prend toute la largeur dans le conteneur flex */
             text-align: center;
             margin-bottom: 20px; /* Espace en dessous de l'instruction */
             font-style: italic;
             color: #555;
             /* S'assurer qu'il ne participe pas à la disposition flex des listes */
             flex-shrink: 0;
             flex-grow: 0;
             flex-basis: 100%;
        }


        /* Style spécifique au mode 1: Drag and Drop */
        #game-mode-1 .word-list, #game-mode-1 .definition-list {
            list-style: none;
            padding: 0;
            min-width: 250px; /* Largeur minimale pour chaque colonne (ajusté) */
            max-width: 350px; /* Largeur maximale (optionnel) */
             width: 100%; /* S'assure qu'ils sont flexibles */
        }

        #game-mode-1 .word-item {
            background-color: #fff;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            transition: transform 0.2s ease-in-out, opacity 0.2s ease-in-out; /* Animation légère */
             cursor: grab; /* Indique qu'on peut attraper */
        }
         #game-mode-1 .word-item:active { cursor: grabbing; }
         #game-mode-1 .word-item.dragging {
            opacity: 0.5; /* Rendre l'élément semi-transparent pendant le drag */
            transform: scale(0.95); /* Réduire légèrement pendant le drag */
         }
        #game-mode-1 .word-item.placed {
            background-color: #e9ecef; /* Gris clair */
            color: #6c757d; /* Texte gris */
            cursor: not-allowed; /* Curseur interdit */
            opacity: 0.7;
            pointer-events: none; /* Empêche les interactions de souris */
            transform: none; /* Annule la transformation */
            box-shadow: none; /* Annule l'ombre */
             text-decoration: line-through; /* Barre le mot placé */
        }


        #game-mode-1 .definition-item {
             background-color: #fff;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
             min-height: 50px; /* Assure une hauteur minimale */
             border-left: 5px solid transparent; /* Petite barre latérale pour feedback */
             transition: border-color 0.3s ease, background-color 0.3s ease; /* Anime les couleurs */
        }
         /* Style pour l'état de drop possible (optionnel) */
         /*
         #game-mode-1 .definition-item.drag-over {
             border-color: #007bff;
         }
         */


        /* Style spécifique au mode 2: Saisie (Définition -> Mot) */
        #game-mode-2.game-container {
            flex-direction: column; /* Aligne les éléments de la liste verticalement */
            align-items: center; /* Centre la colonne unique horizontalement */
        }

        #game-mode-2 .word-definition-input-list {
            list-style: none;
            padding: 0;
            min-width: 400px; /* Largeur minimale pour la colonne unique */
            max-width: 600px; /* Largeur maximale */
            width: 100%; /* Prend toute la largeur disponible dans son conteneur flex */
            box-sizing: border-box;
        }

        #game-mode-2 .word-definition-item {
            background-color: #fff;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Espace entre la définition et l'input */
            border-left: 5px solid transparent; /* Petite barre latérale pour feedback */
             transition: border-color 0.3s ease, background-color 0.3s ease; /* Anime les couleurs */
             flex-wrap: wrap; /* Permet aux éléments de passer à la ligne si l'écran est trop étroit */
        }

         #game-mode-2 .word-definition-item .definition-text {
             /* Dans ce mode, on affiche la définition */
             margin-right: 15px; /* Espace entre la définition et l'input */
             flex-grow: 1; /* Permet à la définition de prendre de la place */
         }

         #game-mode-2 .word-definition-item input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            flex-grow: 0; /* L'input ne prend pas tout l'espace restant par défaut */
            flex-shrink: 0; /* L'input ne se réduit pas */
            min-width: 150px; /* Largeur minimale pour l'input */
            max-width: 200px; /* Largeur maximale de l'input (ajusté) */
             box-sizing: border-box;
        }


        /* Styles pour le feedback visuel (s'appliquent aux items de liste) */
        .correct {
            background-color: #d4edda !important; /* Vert clair */
            border-color: #28a745 !important; /* Vert plus foncé */
        }

        .incorrect {
            background-color: #f8d7da !important; /* Rouge clair */
            border-color: #dc3545 !important; /* Rouge plus foncé */
        }

        .feedback {
            text-align: center;
            margin-top: 30px;
            font-size: 1.2em;
            min-height: 1.5em; /* Réserve de la place pour le message */
        }

         .feedback.correct-text { /* Ajout d'une classe spécifique pour la couleur du texte feedback */
            color: #28a745; /* Vert */
            font-weight: bold;
        }
         .feedback.incorrect-text { /* Ajout d'une classe spécifique pour la couleur du texte feedback */
             color: #dc3545; /* Rouge */
             font-weight: bold;
         }


        .completion-message {
            text-align: center;
            margin-top: 30px;
            font-size: 1.5em;
            color: #007bff;
            font-weight: bold;
            display: none; /* Caché par défaut */
        }

        .reset-button {
            display: none; /* Caché par défaut */
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #6c757d;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: block; /* Pour centrer le bouton bloc */
        }
         .reset-button:hover {
             background-color: #5a6268;
         }


    </style>
</head>
<body>

    <h1>Jeu de Vocabulaire</h1>

    <div class="mode-selection">
        <h2>Choisis ton mode de jeu :</h2>
        <input type="radio" id="mode1" name="mode" value="dragdrop">
        <label for="mode1">Mode 1 : Relier le mot à sa définition (Drag & Drop)</label><br><br>

        <input type="radio" id="mode2" name="mode" value="typing">
        <label for="mode2">Mode 2 : Taper le mot correspondant à la définition</label><br><br>

        <button id="startGameButton" disabled>Commencer le jeu</button>
    </div>

    <div id="game-mode-1" class="game-container">
         <p class="instructions">Relie chaque mot à sa définition en glissant le mot avec la souris (Drag & Drop).</p>
        <ul id="word-list-mode1" class="word-list">
            <!-- Mots à glisser (Mode 1) -->
        </ul>
        <ul id="definition-list-mode1" class="definition-list">
            <!-- Définitions (Mode 1) -->
        </ul>
    </div>

     <div id="game-mode-2" class="game-container">
         <p class="instructions">Pour chaque définition, tape le mot correspondant dans la zone de saisie.</p>
         <ul id="word-definition-input-list-mode2" class="word-definition-input-list">
            <!-- Définitions et Inputs (Mode 2) -->
         </ul>
    </div>


    <div id="feedback" class="feedback">
        <!-- Messages de feedback -->
    </div>

     <div id="completion-message" class="completion-message">
        <!-- Message de fin de jeu -->
    </div>

    <button id="resetGameButton" class="reset-button">Recommencer</button>


    <script>
        /* --- Script JavaScript pour la logique du jeu --- */

        // --- Configuration du jeu : Le vocabulaire ---
        // Les données réelles seront injectées ici par l'IA en remplaçant le bloc de commentaires ci-dessous.
        // START_VOCABULARY_DATA
        const vocabulaireData = [
            { word: "ExempleMot1", definition: "ExempleDéfinition1." },
            { word: "ExempleMot2", definition: "ExempleDéfinition2." }
            // L'IA remplacera cette section par les vraies données JSON.
        ];
        // END_VOCABULARY_DATA

        // Adaptation pour la nouvelle structure JSON (objet avec propriété "vocabulaire")
        // Si vocabulaireData est un objet avec propriété "vocabulaire", on extrait le tableau
        const motsDefinitions = Array.isArray(vocabulaireData) ? vocabulaireData : 
                               (vocabulaireData && vocabulaireData.vocabulaire ? vocabulaireData.vocabulaire : []);

        // --- Variables d'état du jeu ---
        let currentMode = null; // Stocke le mode de jeu sélectionné ('dragdrop' ou 'typing')
        let motsCorrects = 0; // Compteur de paires correctement trouvées
        const totalMots = motsDefinitions.length; // Nombre total de paires à trouver

        // --- Références aux éléments HTML importants ---
        const modeSelectionDiv = document.querySelector('.mode-selection');
        const startGameButton = document.getElementById('startGameButton');
        const gameContainerMode1 = document.getElementById('game-mode-1');
        const gameContainerMode2 = document.getElementById('game-mode-2');
        const wordListMode1 = document.getElementById('word-list-mode1');
        const definitionListMode1 = document.getElementById('definition-list-mode1');
        const wordDefinitionInputListMode2 = document.getElementById('word-definition-input-list-mode2'); // Renommé pour être plus clair
        const feedbackDiv = document.getElementById('feedback');
        const completionMessageDiv = document.getElementById('completion-message');
        const resetButton = document.getElementById('resetGameButton');


        // --- Fonction utilitaire pour mélanger un tableau (algorithme de Fisher-Yates) ---
        function shuffleArray(array) {
            const shuffled = [...array]; // Crée une copie pour ne pas modifier l'original
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; // Échange les éléments
            }
            return shuffled;
        }

        // --- Initialisation : Configuration des événements pour le choix du mode ---
        function initModeSelection() {
             // Active le bouton "Commencer" quand un mode est sélectionné
            document.querySelectorAll('input[name="mode"]').forEach(radio => {
                radio.addEventListener('change', (event) => {
                    startGameButton.disabled = false;
                    currentMode = event.target.value; // Stocke le mode sélectionné
                });
            });

            // Événement sur le bouton "Commencer"
            startGameButton.addEventListener('click', startGame);

            // Événement sur le bouton "Recommencer"
            resetButton.addEventListener('click', resetGame);
        }

        // --- Fonction pour démarrer le jeu après sélection du mode ---
        function startGame() {
            if (!currentMode) {
                alert("Veuillez choisir un mode de jeu !");
                return;
            }

            // Cache la sélection du mode et affiche le bon conteneur de jeu
            modeSelectionDiv.style.display = 'none';
            completionMessageDiv.style.display = 'none';
            resetButton.style.display = 'block'; // Affiche le bouton Recommencer
            feedbackDiv.textContent = ''; // Efface les feedbacks précédents
            feedbackDiv.className = 'feedback'; // Réinitialise les classes de feedback


            // Réinitialise les variables du jeu
            motsCorrects = 0;

            // Affiche le jeu selon le mode choisi
            displayGame(currentMode);
        }

         // --- Fonction pour afficher le jeu en fonction du mode ---
        function displayGame(mode) {
             // Cache les deux conteneurs de jeu d'abord
            gameContainerMode1.style.display = 'none';
            gameContainerMode2.style.display = 'none';

            // Efface le contenu précédent
            wordListMode1.innerHTML = '';
            definitionListMode1.innerHTML = '';
            wordDefinitionInputListMode2.innerHTML = '';

            if (mode === 'dragdrop') {
                gameContainerMode1.style.display = 'flex'; // Affiche le conteneur flex
                generateMode1Lists();
                setupMode1Listeners();
            } else if (mode === 'typing') {
                 gameContainerMode2.style.display = 'flex'; // Affiche le conteneur flex
                 generateMode2List();
                 setupMode2Listeners();
            }
        }

        // --- Génère les listes pour le Mode 1 (Drag & Drop) ---
        function generateMode1Lists() {
            // Mélange uniquement les mots pour la colonne de gauche
            const motsMelanges = shuffleArray(motsDefinitions.map(item => item.word));
             // Mélange uniquement les définitions pour la colonne de droite (mais on garde le lien mot-déf)
             const definitionsMelangees = shuffleArray([...motsDefinitions]);


            // Crée les éléments pour les mots à glisser
            motsMelanges.forEach(mot => {
                const li = document.createElement('li');
                li.classList.add('word-item');
                li.textContent = mot;
                li.setAttribute('draggable', true);
                li.dataset.word = mot; // Stocke le mot
                wordListMode1.appendChild(li);
            });

            // Crée les éléments pour les définitions (cibles de drop)
            definitionsMelangees.forEach(item => {
                const li = document.createElement('li');
                li.classList.add('definition-item');
                li.textContent = item.definition;
                // Stocke le mot CORRECT attendu pour cette définition
                li.dataset.correctWord = item.word.toLowerCase();
                definitionListMode1.appendChild(li);
            });
        }

        // --- Génère la liste pour le Mode 2 (Saisie Définition -> Mot) ---
         function generateMode2List() {
             // Mélange les paires mot-définition pour mélanger l'ordre
             const vocabulaireMelange = shuffleArray([...motsDefinitions]);

             vocabulaireMelange.forEach(item => {
                 const li = document.createElement('li');
                 li.classList.add('word-definition-item');

                 const definitionSpan = document.createElement('span');
                 definitionSpan.classList.add('definition-text');
                 // Affiche la DÉFINITION
                 definitionSpan.textContent = item.definition;
                 li.appendChild(definitionSpan);

                 const input = document.createElement('input');
                 input.setAttribute('type', 'text');
                 input.setAttribute('placeholder', 'Tape le mot ici...');
                 // Stocke le MOT CORRECT attendu dans un data attribute de l'input
                 input.dataset.correctWord = item.word.toLowerCase();
                 li.appendChild(input);

                 wordDefinitionInputListMode2.appendChild(li);
             });
         }


        // --- Configure les événements pour le Mode 1 (Drag & Drop) ---
        function setupMode1Listeners() {
             const motsDraggables = wordListMode1.querySelectorAll('.word-item');
             const zonesDrop = definitionListMode1.querySelectorAll('.definition-item');

             motsDraggables.forEach(motItem => {
                 motItem.addEventListener('dragstart', (event) => {
                     event.dataTransfer.setData('text/plain', event.target.dataset.word);
                     event.dataTransfer.effectAllowed = 'move';
                     event.target.classList.add('dragging');
                 });
                 motItem.addEventListener('dragend', (event) => {
                     event.target.classList.remove('dragging');
                     // Optionnel: effacer le feedback 'drag-over' si on lâche ailleurs
                     zonesDrop.forEach(zone => zone.classList.remove('drag-over'));
                 });
             });

             zonesDrop.forEach(zone => {
                 // Événement quand un élément draggable arrive au-dessus
                 zone.addEventListener('dragover', (event) => {
                     event.preventDefault(); // Indispensable pour autoriser le drop
                     event.dataTransfer.dropEffect = 'move';
                     // Optionnel: ajouter un feedback visuel à la zone de drop
                     // zone.classList.add('drag-over');

                     // Logique pour le défilement automatique
                     const scrollSensitivity = 50; // Pixels du bord pour déclencher le scroll
                     const scrollSpeed = 10;       // Vitesse de défilement en pixels

                     if (event.clientY < scrollSensitivity) {
                         window.scrollBy(0, -scrollSpeed);
                     } else if (event.clientY > window.innerHeight - scrollSensitivity) {
                         window.scrollBy(0, scrollSpeed);
                     }
                 });

                 // Événement quand l'élément draggable quitte la zone
                 zone.addEventListener('dragleave', () => {
                     // Optionnel: retirer le feedback visuel
                     // zone.classList.remove('drag-over');
                 });


                 // Événement quand l'élément est lâché
                 zone.addEventListener('drop', (event) => {
                     event.preventDefault();
                     // zone.classList.remove('drag-over'); // Retirer le feedback visuel

                     // Récupère le mot qui a été glissé
                     const droppedWord = event.dataTransfer.getData('text/plain');

                     // Vérifie la réponse
                     verifyAnswerMode1(droppedWord, zone);
                 });
             });
        }

        // --- Configure les événements pour le Mode 2 (Saisie) ---
         function setupMode2Listeners() {
             const inputsReponse = wordDefinitionInputListMode2.querySelectorAll('input[type="text"]');

             inputsReponse.forEach(input => {
                 // Vérifie quand l'utilisateur sort du champ
                 input.addEventListener('change', (event) => {
                     verifyAnswerMode2(event.target);
                 });
                  // Vérifie quand l'utilisateur appuie sur Entrée
                  input.addEventListener('keypress', (event) => {
                     if (event.key === 'Enter') {
                         verifyAnswerMode2(event.target);
                         event.preventDefault(); // Empêche le comportement par défaut (saut de ligne)
                     }
                 });

                  // Optionnel : Effacer la couleur de feedback incorrecte quand on commence à taper
                  input.addEventListener('input', (event) => {
                      const parentItem = event.target.closest('.word-definition-item');
                      parentItem.classList.remove('incorrect');
                      // On ne retire pas 'correct' ici, car c'est permanent
                  });
             });
         }


        // --- Vérifie la réponse pour le Mode 1 (Drag & Drop) ---
         function verifyAnswerMode1(droppedWord, targetDefinitionItem) {
            // S'assurer que la zone de drop n'est pas déjà correcte
             if (targetDefinitionItem.classList.contains('correct')) {
                 // Si c'est déjà correct, on ignore ce drop
                 afficherFeedback(`Cette paire est déjà trouvée !`, 'incorrect-text');
                 return;
             }

             // Nettoie les classes de feedback incorrectes précédentes sur CET élément
             targetDefinitionItem.classList.remove('incorrect');
             feedbackDiv.textContent = ''; // Efface le message de feedback global
             feedbackDiv.className = 'feedback';


             const correctWord = targetDefinitionItem.dataset.correctWord;

             if (droppedWord.toLowerCase() === correctWord) {
                 // C'est CORRECT !
                 targetDefinitionItem.classList.add('correct');
                 // targetDefinitionItem.textContent += ` (${droppedWord})`; // Optionnel: afficher le mot

                 // Trouver le mot correspondant dans la liste draggable et le marquer comme placé
                 const wordItem = wordListMode1.querySelector(`.word-item[data-word="${droppedWord}"]`);
                 if (wordItem) {
                     wordItem.classList.add('placed');
                 }

                 motsCorrects++; // Incrémente le compteur
                 afficherFeedback("Bravo, bonne paire ! 👍", 'correct-text');

                 // Vérifie si le jeu est terminé
                 checkCompletion();

             } else {
                 // C'est INCORRECT
                 targetDefinitionItem.classList.add('incorrect');
                 afficherFeedback(`"${droppedWord}" n'est pas la bonne réponse ici. Essaie encore ! 🤔`, 'incorrect-text');

                 // Retire la classe 'incorrect' après un court délai
                 setTimeout(() => {
                     targetDefinitionItem.classList.remove('incorrect');
                 }, 1500); // 1.5 secondes
             }
         }

        // --- Vérifie la réponse pour le Mode 2 (Saisie Définition -> Mot) ---
         function verifyAnswerMode2(inputElement) {
             // S'assurer que l'input n'est pas déjà désactivé (donc correct)
             if (inputElement.disabled) {
                 return; // Ignore si la réponse est déjà validée
             }

             const reponseUtilisateur = inputElement.value.trim().toLowerCase(); // Réponse tapée
             const correctWord = inputElement.dataset.correctWord.toLowerCase(); // Mot attendu

             // On trouve l'élément parent (le li.word-definition-item) pour le feedback visuel
             const parentItem = inputElement.closest('.word-definition-item');

             // Nettoie les classes de feedback précédentes sur CET élément
             parentItem.classList.remove('correct', 'incorrect');
             feedbackDiv.textContent = ''; // Efface le message de feedback global
             feedbackDiv.className = 'feedback';

             // Ne vérifie que si l'utilisateur a tapé quelque chose
             if (reponseUtilisateur === '') {
                 // Si le champ est vidé, on ne fait rien ou on peut ajouter un message si besoin
                 return;
             }


             if (reponseUtilisateur === correctWord) {
                 // C'est CORRECT !
                 parentItem.classList.add('correct');
                 inputElement.disabled = true; // Désactive l'input pour cette réponse correcte
                 inputElement.value = inputElement.dataset.correctWord; // Met la version correcte (avec la casse d'origine si stockée)

                 motsCorrects++; // Incrémente le compteur
                 afficherFeedback("Bravo, bonne réponse ! 👍", 'correct-text');

                 // Vérifie si le jeu est terminé
                 checkCompletion();

             } else {
                 // C'est INCORRECT
                 parentItem.classList.add('incorrect');
                 afficherFeedback("Incorrect, essaie encore ! 🤔", 'incorrect-text');
                 // L'input reste actif pour que l'élève puisse corriger
             }
         }


        // --- Fonction pour afficher un message de feedback ---
        function afficherFeedback(message, type = '') {
            feedbackDiv.textContent = message;
            feedbackDiv.className = 'feedback ' + type; // Met à jour les classes pour le style
        }

         // --- Fonction pour vérifier si toutes les paires sont trouvées ---
         function checkCompletion() {
             if (motsCorrects === totalMots) {
                 afficherMessageCompletion();
             }
         }

        // --- Fonction pour afficher le message de fin de jeu ---
        function afficherMessageCompletion() {
            completionMessageDiv.textContent = "🥳 Félicitations ! Tu as trouvé toutes les paires ! 🥳";
            completionMessageDiv.style.display = 'block'; // Affiche le message

             // Désactive toutes les interactions restantes
             document.querySelectorAll('.word-item:not(.placed)').forEach(item => item.classList.add('placed'));
             document.querySelectorAll('input[type="text"]:not(:disabled)').forEach(input => input.disabled = true);

             afficherFeedback(""); // Efface le dernier feedback
        }

         // --- Fonction pour réinitialiser le jeu ---
         function resetGame() {
             // Réinitialise les variables d'état
             currentMode = null;
             motsCorrects = 0;

             // Cache les messages et boutons liés au jeu actif
             gameContainerMode1.style.display = 'none';
             gameContainerMode2.style.display = 'none';
             feedbackDiv.textContent = '';
             feedbackDiv.className = 'feedback';
             completionMessageDiv.style.display = 'none';
             resetButton.style.display = 'none'; // Cache le bouton Recommencer

             // Réaffiche l'écran de sélection du mode
             modeSelectionDiv.style.display = 'block';
             document.querySelectorAll('input[name="mode"]').forEach(radio => {
                 radio.checked = false; // Décoche les boutons radio
             });
             startGameButton.disabled = true; // Désactive le bouton Commencer à nouveau

              // Nettoie les contenus des listes de jeu
             wordListMode1.innerHTML = '';
             definitionListMode1.innerHTML = '';
             wordDefinitionInputListMode2.innerHTML = '';

             console.log("Jeu réinitialisé. Choisis un nouveau mode.");
         }


        // --- Initialisation : Attend que le contenu HTML soit chargé ---
        document.addEventListener('DOMContentLoaded', () => {
            initModeSelection(); // Commence par configurer le choix du mode
        });

    </script>

</body>
