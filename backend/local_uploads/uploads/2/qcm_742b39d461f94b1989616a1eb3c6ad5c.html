<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qu'est-ce qu'un héros ?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 32px 40px 40px 40px;
        }
        h1 {
            color: #286090;
            font-size: 2.2rem;
            margin-bottom: 0.2em;
        }
        .description {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 1.5em;
        }
        .question {
            margin-bottom: 2em;
        }
        .question-title {
            font-weight: bold;
            margin-bottom: 0.7em;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {
            margin-bottom: 0.5em;
        }
        .explication {
            margin-top: 0.7em;
            color: #31708f;
            font-size: 0.98em;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #66a3ff;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #558dcc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Qu'est-ce qu'un héros ?</h1>
        <div class="description">Testez vos connaissances sur la notion de héros.</div>
        
        <div class="question">
            <div class="question-title">Selon les récits traditionnels, quelle qualité est la plus souvent associée à un héros ou une héroïne ?</div>
            <ul class="options">
                
                <li>
                    <label>
                        <input type="radio" name="q1" value="a"> Sa grande richesse personnelle.
                    </label>
                </li>
                
                <li>
                    <label>
                        <input type="radio" name="q1" value="b"> Son indifférence face aux dangers.
                    </label>
                </li>
                
                <li>
                    <label>
                        <input type="radio" name="q1" value="c"> Son courage et son sacrifice pour les autres.
                    </label>
                </li>
                
                <li>
                    <label>
                        <input type="radio" name="q1" value="d"> Son désir de gloire et de reconnaissance.
                    </label>
                </li>
                
            </ul>
            <div class="explication"></div>
        </div>
        
        <button class="submit-btn">Valider</button>
    </div>
</body>
</html>
